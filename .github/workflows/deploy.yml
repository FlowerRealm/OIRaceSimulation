name: Deploy

# Pushes to main build the Vite front-end, apply every D1 migration in order,
# and ship the Worker to Cloudflare. The workflow is the only thing that
# touches production, so deploys are reproducible from the repo state alone.

on:
  push:
    branches: [main]
  # Allow kicking off a deploy from the Actions tab without a commit, handy for
  # re-running after a flaky step or a Cloudflare hiccup.
  workflow_dispatch:

# Two concurrent deploys to the same Worker race on the upload step and the
# loser fails loudly. Serialise them instead.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        # Every .sql file under migrations/, in filename order. They are
        # authored to be idempotent (CREATE TABLE IF NOT EXISTS,
        # ALTER TABLE ... DEFAULT), so re-running on an already-migrated
        # database is a no-op rather than a failure.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "::group::Applying $f"
            npx wrangler d1 execute oi-race-db --remote --file="$f"
            echo "::endgroup::"
          done

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
