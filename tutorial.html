d-hint" style="display:none">✅正确路径已找到</span></div></div><button class="btn btn-restart hidden" id="btnRestart">🔄 重新开始</button></div><div class="leaderboard-container hidden" id="leaderboardContainer"><div class="leaderboard-title">🏅总分排行榜</div><div class="leaderboard-subtitle">每场比赛后动态排名</div><div class="leaderboard-msg" id="leaderboardMsg"></div><div id="leaderboardContent" class="leaderboard-list"><div class="leaderboard-empty">暂无数据</div></div><div class="leaderboard-rank-legend">↑排名上升 ↓下降 →不变</div><div class="food-panel hidden" id="leaderboardFoodPanel"><div class="food-title">🍔食物(容量:<span id="foodCapacityLb">3</span>)</div><div class="food-list" id="leaderboardFoodList"></div></div></div></div><div class="overlay hidden" id="skillUpgradeOverlay"><div class="modal"><div class="dig-shop-tabs"><button class="tab-btn active" id="tabDig">⛏️挖掘场</button><button class="tab-btn" id="tabShop">🏪商店</button></div><div id="digContent"><div class="overlay-tut-msg highlight" id="overlayDigTutMsg"></div><div id="digSpecialStatusContainer"></div><h2 class="skill-title">⛏️平面挖掘探索</h2><p class="skill-points-display">💎技能点:<span id="digSkillPoints">0</span><span id="digSpEarned" class="sp-earned-display" style="display:none"></span></p><p class="skill-points-display">🧠思维:<span id="digMindDisplay">4</span></p><p id="digBonusInfo" style="font-size:.75rem;color:#666"></p><div class="dig-message" id="digMessage"></div><div class="dig-grid-container"><div class="dig-viewport" id="digViewport"><div class="dig-grid" id="digGrid"></div></div></div><div class="dig-legend"><span class="dig-legend-item"><span class="dig-legend-swatch" style="background:#e8f5e9;border-color:#5a9a4b"></span>💎技能点</span><span class="dig-legend-item"><span class="dig-legend-swatch" style="background:#fff3e0;border:3px solid #e8943a"></span>🧠思维</span><span class="dig-legend-item"><span class="dig-legend-swatch" style="background:#e8f2fa;border:3px solid #5b9bd5"></span>⏰时间</span><span class="dig-legend-item"><span class="dig-legend-swatch" style="background:#f3eaf7;border-color:#9b59b6"></span>💠稀有</span><span class="dig-legend-item"><span class="dig-legend-swatch" style="background:#fffcf0;border-color:#e6a817"></span>🛡️保护</span><span class="dig-legend-item"><span class="dig-legend-swatch" style="background:var(--dinl);border:3px solid var(--din)"></span>⚡振奋</span><span class="dig-legend-item"><span class="dig-legend-swatch" style="background:#fff3e0;border:3px solid #e8943a"></span>📚学习</span></div><p style="font-size:.7rem;color:#888">消耗1技能点挖掘|可任意挖掘</p><p id="digRemainingHint" style="font-size:.7rem;color:#999"></p><div class="food-panel" id="digFoodPanel"><div class="food-title">🍔食物(容量:<span id="digFoodCap">3</span>)</div><div class="food-list" id="digFoodList"></div></div><button class="btn-continue" id="btnCloseDig">▶继续</button></div><div id="shopContent" class="shop-content"><div class="overlay-tut-msg highlight" id="overlayShopTutMsg"></div><h3>🏪商店</h3><p class="skill-points-display">💎技能点:<span id="shopSkillPoints">0</span></p><div id="shopItems"></div></div></div></div><div class="overlay hidden" id="gameOverOverlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalScoreSummary"></div><div id="modalChallengesUsed"></div><div id="modalHistory"></div><div id="modalButtons"><button class="btn btn-restart" id="btnModalRestart">🔄完全重置</button><button class="btn-continue hidden" id="btnModalContinue">▶继续</button></div></div></div><script>
(function(){
const LW=1200,LH=700,canvas=document.getElementById('treeCanvas'),ctx=canvas.getContext('2d');canvas.width=LW;canvas.height=LH;
let maps=[],activeMapIdx=0,remTime=40,remStamina=40,maxStaminaActual=40,focusStacks=0,focusMapIdx=-1,inferMode=!1,inferResults=new Map(),nodeAnimations={},gm=4,sp=0,gameStarted=!0,tutorialStep=0,tutorialSubStep=0,stepAchecked=!1,stepBunlocked=!1,stepBchecked=!1,step7digInit=!1,step8shopInit=!1,step7map2created=!1,step7switched=!1,food=[],foodCap=3,shop={timeToSp:!1,timeMaster:!1,pocket:0,sharpIntuition:!1,snickers:!1,coffee:!1,apple:!1,shriek:!1},digCells=null,digRevealed=null,digStructMap=null,digGroups=[],digTrans={x:0,y:0},digDragStart=null,playerName='教程玩家',rankings=[],levelHistory=[],totalHistScore=0,shakeRaf=null;
let ch={I:!1,II:!1,III:!1,I_exp:!1,IV:!1,V:!1,VI:!1,VII:!1,II_exp:!1,VIII:!1,IX:!1,X:!1,III_exp:!1,fun_I:!1,fun_II:!1};
const LV=[{name:'CSP-S模拟赛',maps:4,pass:200,stam:25,sim:!0},{name:'CSP-S',maps:4,pass:200,stam:25,sim:!1}];
function cfgL(l){return LV[Math.min(l,LV.length-1)]}
function minCorDepth(l){let b=Math.floor(l/3)+2;if(l>=5&&l<=10)b--;if(ch.X)b++;return b}
function minNodes(l){let b;if(l<=1)b=8;else if(l<=4)b=12;else if(l<=7)b=18;else b=24;if(l<=4)b+=4;if(ch.X)b+=8;return b}
function rI(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seedR(s){let x=s;return function(){x=(x*16807)%2147483647;return(x-1)/2147483646}}
function getEffMind(){return gm+focusStacks}
function staminaCost(n){return Math.max(1,(n.req||0)-getEffMind())}
function getMaxS(lv){if(lv<=1)return 70;if(lv<=4)return 80;if(lv<=10)return 90;return 100}
function getK(){return ch.II_exp?15:10}
function randomReq(depth,gl){const minR=gl+Math.floor(depth*gl/12),maxR=Math.ceil(gl*1.5+depth*gl/6);if(minR>=maxR)return Math.max(0,maxR);return rI(Math.floor(minR),Math.floor(maxR))}
function genTree(minCorD,level){let id=0;function nid(){return 'N'+(id++)}const k=getK(),maxS=getMaxS(level);const root={id:'R',name:'R',type:'process',isCorrect:!1,children:[],parent:null,depth:0,req:randomReq(0,level+1),score:null};const all=[root];const exp=[root];while(all.length<minNodes(level)){let cand=exp.filter(p=>p.children.length<(p.type==='important'?2:3));if(!cand.length)cand=all.filter(n=>n.type!=='result'&&n.children.length<(n.type==='important'?2:3));if(!cand.length){const nn={id:nid(),name:nid(),type:'process',isCorrect:!1,children:[],parent:root,depth:1,req:randomReq(1,level+1),score:null};root.children.push(nn);all.push(nn);cand=[nn]}const par=cand[rI(0,cand.length-1)];const rem=minNodes(level)-all.length;const avail=Math.min((par.type==='important'?2:3)-par.children.length,rI(1,Math.min(3,rem)));for(let i=0;i<avail;i++){if(all.length>=minNodes(level))break;const cd=par.depth+1;let tp;if(all.length<minNodes(level))tp=Math.random()<0.15?'important':(Math.random()<0.85?'process':'result');else tp=Math.random()<0.2?'important':(Math.random()<0.6?'process':'result');const child={id:nid(),name:nid(),type:tp,isCorrect:!1,children:[],parent:par,depth:cd,req:randomReq(cd,level+1),score:null};all.push(child);par.children.push(child);if(tp!=='result')exp.push(child)}const i=exp.indexOf(par);if(i>=0&&par.children.length>=(par.type==='important'?2:3))exp.splice(i,1)}let resLeaves=all.filter(n=>n.type==='result');if(!resLeaves.length){const p=all.find(n=>n.type==='process'&&n.children.length<3)||all[all.length-1];if(p.type==='result')p.type='process';const ch={id:nid(),name:nid(),type:'result',isCorrect:!1,children:[],parent:p,depth:p.depth+1,req:randomReq(p.depth+1,level+1),score:null};p.children.push(ch);all.push(ch);resLeaves.push(ch)}let deep=resLeaves.filter(n=>n.depth>=minCorD);if(!deep.length){let d=resLeaves.reduce((a,b)=>a.depth>b.depth?a:b);while(d.depth<minCorD){const nch={id:nid(),name:nid(),type:'result',isCorrect:!1,children:[],parent:d,depth:d.depth+1,req:randomReq(d.depth+1,level+1),score:null};d.children.push(nch);all.push(nch);d=nch;resLeaves.push(nch)}deep=[d]}const cor=deep[rI(0,deep.length-1)];cor.score=100;function lca(a,b){const p=new Set();let cur=a;while(cur){p.add(cur);cur=cur.parent}cur=b;while(cur){if(p.has(cur))return cur;cur=cur.parent}return null}resLeaves.forEach(rn=>{if(rn===cor)return;const l=lca(rn,cor);const distMax=Math.max(rn.depth-cor.depth,0)+Math.max(rn.depth-l.depth,cor.depth-l.depth);rn.score=Math.max(1,Math.floor(maxS-distMax*k))});let cur=cor;while(cur){cur.isCorrect=!0;cur=cur.parent}return{defs:all.map(n=>({id:n.id,name:n.name,type:n.type,isCorrect:n.isCorrect,childIds:n.children.map(c=>c.id),req:n.req,score:n.score,depth:n.depth})),correctId:cor.id}}
function buildMap(defs){const m={};defs.forEach(d=>m[d.id]={...d,children:[],parent:null,state:'hidden',x:0,y:0,isFork:!1,req:d.req,score:d.score,depth:d.depth,_b:null,_cb:null,_importantHasCorrect:!1});Object.values(m).forEach(n=>{n.childIds.forEach(cid=>{const c=m[cid];if(c){n.children.push(c);c.parent=n}});if(n.type==='process'&&n.children.length>1)n.isFork=!0});return m}
function createMap(minD,level){const{defs,correctId}=genTree(minD,level);const nm=buildMap(defs);const root=nm['R'];Object.values(nm).forEach(n=>n.state='hidden');root.state='visible_locked';return{nodeMap:nm,root,correctResult:nm[correctId],totalUnlocked:0,gameOver:!1,gameResult:null,maxResultScore:0,hasSkillNode:!1,skillNodeId:null,totalStaminaSpent:0}}
function createTutorialMap1(){const defs=[{id:'R',name:'R',type:'process',isCorrect:!0,childIds:['A','B'],req:3,score:null,depth:0},{id:'A',name:'A',type:'important',isCorrect:!1,childIds:['A1','A2'],req:4,score:null,depth:1},{id:'B',name:'B',type:'important',isCorrect:!0,childIds:['B1','B2'],req:5,score:null,depth:1},{id:'A1',name:'A1',type:'result',isCorrect:!1,childIds:[],req:4,score:60,depth:2},{id:'A2',name:'A2',type:'result',isCorrect:!1,childIds:[],req:4,score:70,depth:2},{id:'B1',name:'B1',type:'result',isCorrect:!1,childIds:[],req:5,score:50,depth:2},{id:'B2',name:'B2',type:'result',isCorrect:!0,childIds:[],req:6,score:100,depth:2}];const nm=buildMap(defs);const root=nm['R'];Object.values(nm).forEach(n=>n.state='hidden');root.state='visible_locked';return{nodeMap:nm,root,correctResult:nm['B2'],totalUnlocked:0,gameOver:!1,gameResult:null,maxResultScore:0,hasSkillNode:!1,skillNodeId:null,totalStaminaSpent:0}}
function createTutorialMap2(){const defs=[{id:'R2',name:'R2',type:'process',isCorrect:!0,childIds:['C','E'],req:2,score:null,depth:0},{id:'C',name:'C',type:'important',isCorrect:!0,childIds:['C_skill','C2'],req:6,score:null,depth:1},{id:'E',name:'E',type:'process',isCorrect:!1,childIds:['E1','E2'],req:3,score:null,depth:1},{id:'C_skill',name:'💎奖励',type:'skill',isCorrect:!0,childIds:[],req:3,score:100,depth:2},{id:'C2',name:'C2',type:'result',isCorrect:!1,childIds:[],req:3,score:35,depth:2},{id:'E1',name:'E1',type:'result',isCorrect:!1,childIds:[],req:3,score:25,depth:2},{id:'E2',name:'E2',type:'result',isCorrect:!1,childIds:[],req:3,score:15,depth:2}];const nm=buildMap(defs);const root=nm['R2'];Object.values(nm).forEach(n=>n.state='hidden');root.state='visible_locked';return{nodeMap:nm,root,correctResult:nm['C_skill'],totalUnlocked:0,gameOver:!1,gameResult:null,maxResultScore:0,hasSkillNode:!0,skillNodeId:'C_skill',totalStaminaSpent:0}}
function getActive(){return maps[activeMapIdx]}
function canUnlock(n,map){return n.state==='visible_locked'&&!map.gameOver&&remTime>0&&remStamina>0&&(n===map.root||(n.parent&&(n.parent.state==='unlocked'||n.parent.state==='correct'||n.parent.state==='incorrect')))}
function canCheck(n,map){return n.state==='unlocked'&&!map.gameOver&&remTime>0&&remStamina>0&&(n.type==='important'||n.type==='result'||n.type==='skill')}
function markCorrect(n){if(n.state!=='correct')n.state='correct'}
function markIncorrect(n){if(n.state==='incorrect'||n.state==='correct')return;n.state='incorrect';n.children.forEach(c=>markIncorrect(c))}
function checkFork(f){if(!f.isFork||f.state==='incorrect'||f.state==='correct')return;if(f.children.every(c=>c.state==='incorrect')){markIncorrect(f);if(f.parent?.isFork)checkFork(f.parent)}}
function getMaxSub(node){if(node.type==='result'||node.type==='skill')return node.score||0;let m=0;function dfs(n){if((n.type==='result'||n.type==='skill')&&n.score>m)m=n.score;n.children.forEach(dfs)}dfs(node);return m}
function flashCorrectBorder(){const gc=document.getElementById('gameContainer');gc.classList.add('correct-flash');setTimeout(()=>gc.classList.remove('correct-flash'),550)}
function flashBlueBorder(){const gc=document.getElementById('gameContainer');gc.classList.add('blue-flash');setTimeout(()=>gc.classList.remove('blue-flash'),550)}
function computeLayout(md){const{nodeMap,root}=md;const lvls={},nlvl={};function assignLv(n,lv){n.depth=lv;nlvl[n.id]=lv;if(!lvls[lv])lvls[lv]=[];lvls[lv].push(n);n.children.forEach(c=>assignLv(c,lv+1))}assignLv(root,0);const maxLv=Math.max(...Object.keys(lvls).map(Number),0);const lvH=LH/(maxLv+2),topM=lvH*0.9;function leafCnt(n){if(!n.children.length)return 1;return n.children.reduce((s,c)=>s+leafCnt(c),0)}const lc={};Object.values(nodeMap).forEach(n=>lc[n.id]=leafCnt(n));const totalL=lc[root.id]||1,margin=60;function assignX(n,left,right){const w=(right-left)*(lc[n.id]/totalL);n.x=n===root?LW/2:left+w/2;n.y=topM+nlvl[n.id]*lvH;let childLeft=left;n.children.forEach(c=>{const cw=(right-left)*(lc[c.id]/totalL);assignX(c,childLeft,childLeft+cw);childLeft+=cw})}assignX(root,margin,LW-margin);Object.values(lvls).forEach(lns=>{lns.sort((a,b)=>a.x-b.x);for(let i=1;i<lns.length;i++)if(lns[i].x-lns[i-1].x<70)lns[i].x=lns[i-1].x+70;const avg=lns.reduce((s,n)=>s+n.x,0)/lns.length;lns.forEach(n=>n.x+=LW/2-avg);lns.forEach(n=>n.x=Math.max(margin,Math.min(LW-margin,n.x)))})}
function isActionAllowed(action,node,map){const ts=tutorialStep,mIdx=maps.indexOf(map);if(ts>=14)return!0;if(mIdx===0){if(ts>=7)return!1;if(ts===0){if(action==='unlock'&&node.id==='R')return!0;return!1}if(ts===1){if(action==='unlock'&&node.id==='A')return!0;if(action==='unlock'&&node.id==='B'){setGM('⚠️请先解锁节点A','warning');return!1}return!1}if(ts===2){if(action==='check'&&node.id==='A')return!0;return!1}if(ts===3){const a=map.nodeMap['A'];if(a&&(a.state==='correct'||a.state==='incorrect')){const children=a.children.filter(c=>c.type==='result');if(action==='unlock'&&children.some(c=>c.id===node.id&&c.state==='visible_locked'))return!0;if(action==='check'&&children.some(c=>c.id===node.id&&c.state==='unlocked'))return!0}return!1}if(ts===4){if(action==='unlock'&&node.id==='B')return!0;if(action==='unlock'&&node.id==='A'){setGM('⚠️请解锁节点B','warning');return!1}return!1}if(ts===5){if(action==='check'&&node.id==='B')return!0;return!1}if(ts===6){const b=map.nodeMap['B'];if(b&&(b.state==='correct'||b.state==='incorrect')){const children=b.children.filter(c=>c.type==='result');if(action==='unlock'&&children.some(c=>c.id===node.id&&c.state==='visible_locked'&&c.isCorrect))return!0;if(action==='check'&&children.some(c=>c.id===node.id&&c.state==='unlocked'&&c.isCorrect))return!0}return!1}return!1}if(mIdx===1){if(ts===7)return!1;if(ts===8){if(action==='unlock'&&node.id==='R2')return!0;return!1}if(ts===9){if(action==='unlock'&&node.id==='C')return!0;return!1}if(ts===10)return!1;if(ts===11){if((action==='unlock'||action==='check')&&node.id==='C_skill')return!0;return!1}if(ts>=12)return!0;return!1}return!1}

function renderLeaderboardFood(){const cont=document.getElementById('leaderboardFoodList');if(!cont)return;cont.innerHTML=food.length?food.map((f,i)=>`<span class="food-item" onclick="window._useFood(${i},event)">${f.name}</span>`).join(''):'<span style="color:#bbb;font-size:.68rem;">无食物</span>';document.getElementById('foodCapacityLb').textContent=foodCap}
window._useFood=function(i,evt){if(!gameStarted)return;if(i>=food.length)return;const f=food[i];if(f.name==='苹果'){if(remTime<1){setGM('⏰时间不足无法吃苹果','warning');return}remTime--}remStamina=Math.min(maxStaminaActual,remStamina+f.heal);food.splice(i,1);refreshUI();updateAllFoodDisplays();checkTutorialProgress()}
function initShopPanel(){const items=document.getElementById('shopItems');syncAllSp();const upgs=[{name:'充分利用时间',desc:'剩余每2时间→1技能点',cost:10,key:'timeToSp'},{name:'时间管理大师',desc:'初始时间×1.2',cost:15,key:'timeMaster'},{name:'大大大口袋',desc:'食物容量+1('+(shop.pocket+1)+'/3)',cost:5+shop.pocket*5,key:'pocket',max:3},{name:'敏锐直觉',desc:'推理显示3层内最高分',cost:20,key:'sharpIntuition'},{name:'一天一苹果',desc:'开局苹果填满食物空间',cost:15,key:'apple'}];let html='';upgs.forEach(u=>{const owned=u.key==='pocket'?shop.pocket>=u.max:(shop[u.key]===!0);html+=`<div class="shop-item"><span><b>${u.name}</b><br><small>${u.desc}</small></span>`;if(!owned)html+=`<button class="shop-btn" onclick="window._buyUpgrade('${u.key}')">购买(${u.cost}sp)</button>`;else html+=`<span>✅已拥有</span>`;html+='</div>'});items.innerHTML=html}
window._buyUpgrade=function(key){const costs={timeToSp:10,timeMaster:15,pocket:5+shop.pocket*5,sharpIntuition:20,apple:15};if(sp<costs[key]){setGM('技能点不足','warning');return}if(key==='pocket'){if(shop.pocket>=3){setGM('已达上限','warning');return}sp-=costs[key];shop.pocket++;foodCap++;updateAllFoodDisplays()}else{sp-=costs[key];shop[key]=!0}syncAllSp();initShopPanel();refreshUI();checkTutorialProgress()}
document.getElementById('tabDig').addEventListener('click',()=>{document.getElementById('digContent').style.display='block';document.getElementById('shopContent').style.display='none';document.getElementById('tabDig').classList.add('active');document.getElementById('tabShop').classList.remove('active');syncAllSp();if(odtEl){odtEl.textContent=tmsgEl.textContent;odtEl.className='overlay-tut-msg '+(tmsgEl.className.replace('tutorial-msg','').trim())}});
document.getElementById('tabShop').addEventListener('click',()=>{document.getElementById('digContent').style.display='none';document.getElementById('shopContent').style.display='block';document.getElementById('tabShop').classList.add('active');document.getElementById('tabDig').classList.remove('active');initShopPanel();syncAllSp();if(ostEl){ostEl.textContent=tmsgEl.textContent;ostEl.className='overlay-tut-msg '+(tmsgEl.className.replace('tutorial-msg','').trim())}});
document.getElementById('btnCloseDig').addEventListener('click',()=>{document.getElementById('skillUpgradeOverlay').classList.add('hidden');removeDigDrag();checkTutorialProgress()});
document.getElementById('btnFocus').addEventListener('click',()=>{if(!gameStarted||!getActive()||getActive().gameOver)return;if(remTime<1||remStamina<2){setGM('资源不足','warning');return}remTime--;remStamina-=2;focusStacks++;focusMapIdx=activeMapIdx;updateActBar();refreshUI()});
document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){if(!gameStarted)return;if(document.getElementById('skillUpgradeOverlay').classList.contains('hidden')){inferMode=!inferMode;document.getElementById('canvasWrapper').classList.toggle('inference',inferMode);updateActBar();if(!inferMode)clearAllShake();refreshUI()}}});
document.getElementById('mapSelector').addEventListener('click',e=>{const btn=e.target.closest('.map-btn');if(!btn)return;const idx=+btn.dataset.index;if(!isNaN(idx)&&idx<maps.length){activeMapIdx=idx;if(focusStacks&&focusMapIdx!==activeMapIdx){focusStacks=0;focusMapIdx=-1}refreshUI();checkTutorialProgress()}});
document.getElementById('btnRestart').addEventListener('click',()=>{tutorialStep=0;tutorialSubStep=0;stepAchecked=!1;stepBunlocked=!1;stepBchecked=!1;step7digInit=!1;step8shopInit=!1;step7map2created=!1;step7switched=!1;gm=4;sp=0;focusStacks=0;focusMapIdx=-1;inferMode=!1;inferResults.clear();food=[];shop={timeToSp:!1,timeMaster:!1,pocket:0,sharpIntuition:!1,snickers:!1,coffee:!1,apple:!1,shriek:!1};foodCap=3;remTime=40;remStamina=40;maxStaminaActual=40;clearAllShake();hideAllUI();initTutorial()});
function hideAllUI(){document.getElementById('levelBanner').classList.add('hidden');document.getElementById('attrsPanel').classList.add('hidden');document.getElementById('activeSkillsBar').classList.add('hidden');document.getElementById('scoreProgressPanel').classList.add('hidden');document.getElementById('timePanel').classList.add('hidden');document.getElementById('mapSelector').classList.add('hidden');document.getElementById('infoBar').classList.add('hidden');document.getElementById('btnRestart').classList.add('hidden');document.getElementById('leaderboardContainer').classList.add('hidden');document.getElementById('staminaBarOuter').classList.add('hidden');document.getElementById('staminaRefSpan').classList.add('hidden');document.getElementById('btnFocus').classList.add('hidden');document.getElementById('focusBonusLabel').style.display='none';document.getElementById('leaderboardFoodPanel').classList.add('hidden')}
function showUI(ids){ids.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('hidden')})}
function initTutorial(){maps=[createTutorialMap1()];activeMapIdx=0;computeLayout(maps[0]);remTime=40;remStamina=40;maxStaminaActual=40;gm=4;sp=0;focusStacks=0;focusMapIdx=-1;inferMode=!1;inferResults.clear();food=[];foodCap=3;nodeAnimations={};tutorialStep=0;tutorialSubStep=0;stepAchecked=!1;stepBunlocked=!1;stepBchecked=!1;step7digInit=!1;step8shopInit=!1;step7map2created=!1;step7switched=!1;hideAllUI();showUI(['canvasWrapper']);document.getElementById('canvasWrapper').classList.remove('inference');setTMsg('欢迎来到树形探索教程！\n点击根节点R解锁它（点击圆形节点即可解锁）\n初始时间/精力：40','highlight');refreshUI();gameStarted=!0}
function checkTutorialProgress(){const map=getActive();if(!map)return;switch(tutorialStep){
case 0:{if(map.root&&map.root.state==='unlocked'){tutorialStep=1;setTMsg('很好！根节点已解锁。\n现在请先解锁节点A（左侧的重要检查节点，方形）。\n⚠️请按顺序：先A后B','highlight');refreshUI()}break}
case 1:{const a=map.nodeMap['A'];if(a&&a.state==='unlocked'){tutorialStep=2;setTMsg('节点A已解锁！现在检查它（点击A的虚线圆环）。\n检查会揭示它下面结果节点的信息。','highlight');refreshUI()}break}
case 2:{const a=map.nodeMap['A'];if(a&&(a.state==='correct'||a.state==='incorrect')){stepAchecked=!0;tutorialStep=3;const maxSc=getMaxSub(a);setTMsg(`节点A已检查！它显示破碎痕迹——最高分${maxSc}分。\n这说明A下面没有100分的正确结果。\n现在解锁并检查A下面的一个结果节点。`,'highlight');refreshUI()}break}
case 3:{const a=map.nodeMap['A'];if(a&&(a.state==='correct'||a.state==='incorrect')){const children=a.children.filter(c=>c.type==='result');const checked=children.find(c=>c.state==='correct'||c.state==='incorrect');if(checked){tutorialStep=4;setTMsg('结果节点已检查！\n现在解锁节点B（右侧的重要检查节点，方形）。\n⚠️B是另一个重要检查节点，请解锁它。','highlight');refreshUI()}}break}
case 4:{const b=map.nodeMap['B'];if(b&&b.state==='unlocked'){stepBunlocked=!0;tutorialStep=5;setTMsg('节点B已解锁！现在检查它（点击B的虚线圆环）。\nB下面可能藏着正确结果。','highlight');refreshUI()}break}
case 5:{const b=map.nodeMap['B'];if(b&&(b.state==='correct'||b.state==='incorrect')){stepBchecked=!0;tutorialStep=6;const hasCor=b._importantHasCorrect||b.state==='correct';if(hasCor){setTMsg('节点B已检查！注意看B外面的灰色方形虚线边框——\n这表示B的子树中有正确结果节点（100分）！\n现在解锁B下面那个正确的结果节点并检查它。','highlight')}else{setTMsg('节点B已检查！现在解锁B下面的正确结果节点。','highlight')}refreshUI()}break}
case 6:{const b=map.nodeMap['B'];const correctChild=b&&b.children.find(c=>c.isCorrect&&(c.state==='correct'));if(correctChild){tutorialStep=7;if(!step7map2created){step7map2created=!0;const map2=createTutorialMap2();computeLayout(map2);maps.push(map2);activeMapIdx=0}updateMapSelectorBtns2();showUI(['mapSelector']);document.getElementById('mapSelector').classList.remove('hidden');setTMsg('🎉太棒了！第一个地图的正确结果已找到！\n现在请注意上方出现了"题目切换界面"。\n请点击切换到<b>地图2</b>，我们将在新地图中学习更多机制。','highlight');refreshUI()}break}
case 7:{if(activeMapIdx===1&&maps.length>=2){step7switched=!0;tutorialStep=8;showUI(['timePanel']);document.getElementById('staminaBarOuter').classList.add('hidden');document.getElementById('staminaRefSpan').classList.add('hidden');setTMsg('很好！你切换到了地图2。\n现在请<b>解锁根节点R2</b>（点击它）。\n注意观察时间条的变化——解锁节点会消耗时间！','highlight');refreshUI()}break}
case 8:{const m2=maps[1];if(m2&&m2.root&&m2.root.state==='unlocked'){tutorialStep=9;showUI(['attrsPanel','staminaBarOuter','staminaRefSpan','leaderboardContainer','leaderboardFoodPanel']);document.getElementById('leaderboardFoodPanel').classList.remove('hidden');document.getElementById('btnFocus').classList.add('hidden');document.getElementById('focusBonusLabel').style.display='none';setTMsg('根节点R2已解锁！时间从40减为39（消耗1时间）。\n现在请<b>解锁节点C</b>（左侧的方形重要节点）。\n⚠️注意：节点C的思维需求为<b>6</b>，而你当前思维为<b>4</b>。\n思维低于需求时，解锁需额外消耗精力（2精力而非1精力）！\n观察精力条的变化。','highlight');refreshUI()}break}
case 9:{const m2=maps[1];const cNode=m2&&m2.nodeMap['C'];if(cNode&&cNode.state==='unlocked'){tutorialStep=10;if(!food.some(f=>f.name==='☕咖啡')){food.push({name:'☕咖啡',heal:8})}updateAllFoodDisplays();setTMsg('节点C已解锁！注意精力条减少了2点（而非通常的1点）。\n这就是思维低导致的额外精力消耗。\n现在我给你一杯<b>☕咖啡</b>（在右侧食物面板中），\n请点击咖啡来恢复精力！','highlight');refreshUI()}break}
case 10:{if(!food.some(f=>f.name==='☕咖啡')){tutorialStep=11;setTMsg('咖啡已使用！精力恢复了。\n现在请<b>解锁节点C下面的💎奖励节点</b>（菱形技能节点），\n然后<b>检查它</b>。这个特殊节点可以提供技能点奖励！','highlight');refreshUI()}break}
case 11:{const m2=maps[1];const skillNode=m2&&m2.nodeMap['C_skill'];if(skillNode&&skillNode.state==='correct'){sp+=20;syncAllSp();tutorialStep=12;if(!digRevealed)initDig();if(!step7digInit){step7digInit=!0;initDig();digRevealed[0][0]=!0}food.push({name:'苹果',heal:6});food.push({name:'面包',heal:4});renderDig(!1);document.getElementById('digRemainingHint').textContent='剩余:'+unrevealedCount()+'/400';initDigDrag();document.getElementById('skillUpgradeOverlay').classList.remove('hidden');document.getElementById('digContent').style.display='block';document.getElementById('shopContent').style.display='none';document.getElementById('tabDig').classList.add('active');document.getElementById('tabShop').classList.remove('active');updateAllFoodDisplays();syncAllSp();if(odtEl){odtEl.textContent='🎉太棒了！你找到了技能点奖励节点！获得+20技能点。\n现在进入挖掘场！你有'+fsp(sp)+'技能点，点击"?"格子消耗1技能点挖掘。\n挖掘可获得技能点、思维、时间等奖励。食物可恢复精力。\n挖掘完成后点击"继续"关闭。';odtEl.className='overlay-tut-msg highlight'}setTMsg('🎉技能奖励节点已检查！进入挖掘场。\n你有'+fsp(sp)+'技能点，点击"?"格子消耗1技能点挖掘。\n食物可恢复精力。挖掘完成后点击"继续"关闭。','highlight');refreshUI()}break}
case 12:{if(document.getElementById('skillUpgradeOverlay').classList.contains('hidden')){tutorialStep=13;sp=Math.max(sp,25);syncAllSp();document.getElementById('skillUpgradeOverlay').classList.remove('hidden');document.getElementById('digContent').style.display='none';document.getElementById('shopContent').style.display='block';document.getElementById('tabShop').classList.add('active');document.getElementById('tabDig').classList.remove('active');initShopPanel();syncAllSp();if(ostEl){ostEl.textContent='商店已开启！你有'+fsp(sp)+'技能点。购买技能来增强自己。\n💡提示：关闭商店后你仍可返回挖掘场继续挖掘。\n完成后点击"继续"关闭。';ostEl.className='overlay-tut-msg highlight'}setTMsg('商店已开启！你有'+fsp(sp)+'技能点。\n购买技能来增强自己。\n💡提示：关闭商店后你仍可返回挖掘场。\n完成后点击"继续"关闭。','highlight');}break}
case 13:{if(document.getElementById('skillUpgradeOverlay').classList.contains('hidden')){tutorialStep=14;showUI(['levelBanner','attrsPanel','activeSkillsBar','scoreProgressPanel','timePanel','mapSelector','infoBar','btnRestart','leaderboardContainer','staminaBarOuter','staminaRefSpan']);document.getElementById('btnFocus').classList.remove('hidden');document.getElementById('leaderboardFoodPanel').classList.remove('hidden');remTime=25;remStamina=25;maxStaminaActual=25;gm=Math.max(4,gm);const finalMaps=[];for(let i=0;i<4;i++){const md=createMap(minCorDepth(1),1);computeLayout(md);finalMaps.push(md)}const totalMaps=finalMaps.length;const allRes=[];finalMaps.forEach((md,mi)=>{Object.values(md.nodeMap).filter(n=>n.type==='result').forEach(r=>allRes.push({node:r,mapIdx:mi}))});const sel=shuf([...Array(allRes.length).keys()]).slice(0,totalMaps);const cnt={};sel.forEach(i=>{const{node,mapIdx}=allRes[i];if(!cnt[mapIdx])cnt[mapIdx]=0;if(cnt[mapIdx]<1&&node.type==='result'){node.type='skill';node.name='💎'+node.name;finalMaps[mapIdx].hasSkillNode=!0;finalMaps[mapIdx].skillNodeId=node.id;cnt[mapIdx]++}});maps=finalMaps;activeMapIdx=0;updateMapSelectorBtns2();document.getElementById('levelName').textContent='CSP-S练手';setTMsg('🎉教程完成！所有UI已显示。\n这是CSP-S级别的地图，试试用你学到的技能完成它吧！\n💡你仍可通过食物面板使用食物，也可返回挖掘场。\n灰色方形虚线边框=重要节点包含正确结果(100分)\n祝你好运！🚀','success');refreshUI();}break}
}}
function updateMapSelectorBtns2(){const sel=document.getElementById('mapSelector');sel.innerHTML='';for(let i=0;i<maps.length;i++){const b=document.createElement('button');b.className='map-btn';b.dataset.index=i;b.textContent='⏳地图'+(i+1);sel.appendChild(b)}updateMapBtns()}
function animLoop(){let needsRedraw=!1;const now=performance.now();for(const k in nodeAnimations){const a=nodeAnimations[k];if(a.type==='unlock'&&now-a.start<a.dur){needsRedraw=!0}else if(now-a.start>=a.dur){delete nodeAnimations[k];needsRedraw=!0}}if(needsRedraw&&getActive())drawTree(getActive());if(Object.keys(nodeAnimations).length>0)requestAnimationFrame(animLoop)}setInterval(()=>{if(Object.keys(nodeAnimations).length>0)animLoop()},50);
hideAllUI();initTutorial();updateAllFoodDisplays();
})();</script></body></html>
